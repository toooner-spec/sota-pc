<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State of the Art - Spaceballs (1992)</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #ccc;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 960px;
            width: 100%;
            padding: 20px;
        }
        h1 {
            color: #fff;
            font-size: 1.8em;
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .subtitle {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            max-width: 960px;
            margin: 0 auto;
            background: #111;
            border: 2px solid #333;
        }
        video {
            width: 100%;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .info {
            margin-top: 20px;
            font-size: 0.8em;
            color: #666;
            line-height: 1.6;
        }
        .info a {
            color: #88f;
            text-decoration: none;
        }
        .info a:hover {
            text-decoration: underline;
        }
        .award {
            color: #fc0;
            font-size: 0.85em;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>STATE OF THE ART</h1>
        <div class="subtitle">by Spaceballs &middot; 1992</div>
        <div class="award">1st Place &middot; The Party 1992 &middot; Amiga Demo Competition</div>
        <div class="video-wrapper">
            <video id="demo" controls autoplay loop>
                <source src="sota_demo.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="info">
            <p>Rendered in real-time by a Python engine reverse-engineered from the original Amiga 500 binary.</p>
            <p>320x200 @ 50fps with MOD tracker music &middot; Original by Lone Starr &amp; Moren of Spaceballs.</p>
            <p style="margin-top: 8px;">
                <a href="https://github.com/toooner-spec/sota-pc">Source Code</a>
            </p>
        </div>
    </div>
</body>
</html>
